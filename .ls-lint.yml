ls:
  .dir: regex:\.?[a-z0-9]+(-[a-z0-9]+)*
  .md: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:(README|CONTRIBUTING|CHANGELOG|AGENTS|CLAUDE|SKILL)
  .yaml: regex:[a-z0-9]*([._][a-z0-9]+)* | regex:pnpm-(lock|workspace)
  # .ts/.tsx (also .test/.spec): no `_`-separated token of the name may be utils, util, helpers, helper,
  # manager, common, or formatter. RE2 has no lookahead, so the token pattern is a generated complement
  # of that word list.
  # ls-lint selects the rule by the extension after the first dot, so a forbidden word used as a
  # sub-extension (string.utils.ts) is rejected by the never-matching keys below.
  # Known limit: a forbidden word behind a longer compound extension (widget.test.utils.ts) is not checked.
  .ts: &source_file_name "regex:[._]?(c(o(m(m(o(n[a-z0-9]+|[abcdefghijklmopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnpqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnpqrstuvwxyz0123456789][a-z0-9]*|)|f(o(r(m(a(t(t(e(r[a-z0-9]+|[abcdefghijklmnopqstuvwxyz0123456789][a-z0-9]*|)|[abcdfghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnopqrsuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnopqrsuvwxyz0123456789][a-z0-9]*|)|[bcdefghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnopqstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnpqrstuvwxyz0123456789][a-z0-9]*|)|h(e(l(p(e(r(s[a-z0-9]+|[abcdefghijklmnopqrtuvwxyz0123456789][a-z0-9]*)|[abcdefghijklmnopqstuvwxyz0123456789][a-z0-9]*|)|[abcdfghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnoqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijkmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdfghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|m(a(n(a(g(e(r[a-z0-9]+|[abcdefghijklmnopqstuvwxyz0123456789][a-z0-9]*|)|[abcdfghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefhijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[bcdefghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmopqrstuvwxyz0123456789][a-z0-9]*|)|[bcdefghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|u(t(i(l(s[a-z0-9]+|[abcdefghijklmnopqrtuvwxyz0123456789][a-z0-9]*)|[abcdefghijkmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghjklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnopqrsuvwxyz0123456789][a-z0-9]*|)|[abdegijklnopqrstvwxyz0123456789][a-z0-9]*)([._](c(o(m(m(o(n[a-z0-9]+|[abcdefghijklmopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnpqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnpqrstuvwxyz0123456789][a-z0-9]*|)|f(o(r(m(a(t(t(e(r[a-z0-9]+|[abcdefghijklmnopqstuvwxyz0123456789][a-z0-9]*|)|[abcdfghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnopqrsuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnopqrsuvwxyz0123456789][a-z0-9]*|)|[bcdefghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnopqstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnpqrstuvwxyz0123456789][a-z0-9]*|)|h(e(l(p(e(r(s[a-z0-9]+|[abcdefghijklmnopqrtuvwxyz0123456789][a-z0-9]*)|[abcdefghijklmnopqstuvwxyz0123456789][a-z0-9]*|)|[abcdfghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnoqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijkmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdfghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|m(a(n(a(g(e(r[a-z0-9]+|[abcdefghijklmnopqstuvwxyz0123456789][a-z0-9]*|)|[abcdfghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefhijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[bcdefghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmopqrstuvwxyz0123456789][a-z0-9]*|)|[bcdefghijklmnopqrstuvwxyz0123456789][a-z0-9]*|)|u(t(i(l(s[a-z0-9]+|[abcdefghijklmnopqrtuvwxyz0123456789][a-z0-9]*)|[abcdefghijkmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghjklmnopqrstuvwxyz0123456789][a-z0-9]*|)|[abcdefghijklmnopqrsuvwxyz0123456789][a-z0-9]*|)|[abdegijklnopqrstvwxyz0123456789][a-z0-9]*))*"
  .tsx: *source_file_name
  .test.ts: *source_file_name
  .test.tsx: *source_file_name
  .spec.ts: *source_file_name
  .spec.tsx: *source_file_name
  .utils.ts: &forbidden_sub_extension 'regex:[^\s\S]'
  .utils.tsx: *forbidden_sub_extension
  .util.ts: *forbidden_sub_extension
  .util.tsx: *forbidden_sub_extension
  .helpers.ts: *forbidden_sub_extension
  .helpers.tsx: *forbidden_sub_extension
  .helper.ts: *forbidden_sub_extension
  .helper.tsx: *forbidden_sub_extension
  .manager.ts: *forbidden_sub_extension
  .manager.tsx: *forbidden_sub_extension
  .common.ts: *forbidden_sub_extension
  .common.tsx: *forbidden_sub_extension
  .formatter.ts: *forbidden_sub_extension
  .formatter.tsx: *forbidden_sub_extension
  .*: regex:[a-z0-9]*([._][a-z0-9]+)*

ignore:
  - .git
  - .direnv
  - result
  - result-*
  - "{.venv,.uv-cache,.ruff_cache,.pytest_cache,.ipynb_checkpoints,__pycache__,node_modules,target}"
  - "**/{.venv,.uv-cache,.ruff_cache,.pytest_cache,.ipynb_checkpoints,__pycache__,node_modules,target}"
  - docs/logs
  - "**/docs/logs"

  - "{.pnpm-store,.turbo,.vite}"
  - "**/{.pnpm-store,.turbo,.vite}"
  - "{dist,build,coverage,.next,out,.nuxt,.output,.svelte-kit}"
  - "**/{dist,build,coverage,.next,out,.nuxt,.output,.svelte-kit}"
