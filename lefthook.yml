commit-msg:
  commands:
    commitlint:
      run: commitlint --edit {1}

pre-commit:
  commands:
    oxlint:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec oxlint {staged_files}
    oxfmt:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec oxfmt --check {staged_files}

pre-push:
  commands:
    typecheck:
      run: pnpm run typecheck
    test:
      run: pnpm run test
